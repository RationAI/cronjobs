# Monthly cluster-stats report — fetches cluster_stats.py from the PUBLIC
# GitHub repo at runtime (no auth needed), sends summary + dashboard PNG to
# the Slack channel. Upgrading the script = git push; nothing to rebuild.
#
# Deploy:  cp grafana/cluster_stats/cluster_stats_secrets.yml grafana/cluster_stats/cluster_stats_secrets.local.yml
#          (fill in the two tokens) && kubectl apply -f grafana/cluster_stats/cluster_stats_secrets.local.yml
#          kubectl apply -f grafana/cluster_stats/cluster_stats_cronjob.yml
# Test now (don't wait for the 1st of the month):
#          kubectl -n rationai-jobs-ns create job --from=cronjob/cluster-stats cluster-stats-test
#          kubectl -n rationai-jobs-ns logs -f job/cluster-stats-test
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cluster-stats
  namespace: rationai-jobs-ns
spec:
  schedule: "0 0 1 * *"           # 1st of month 00:00 Europe/Prague (see timeZone)
  timeZone: "Europe/Prague"       # DST-safe; k8s cron would otherwise be UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1    # keep last job around for logs
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      activeDeadlineSeconds: 1800  # 30 min cap
      template:
        spec:
          restartPolicy: Never
          securityContext:            # namespace enforces PodSecurity "restricted"
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
          - name: stats
            image: python:3.12-slim
            workingDir: /tmp        # writable: pip cache, output PNG/HTML
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
            command: ["/bin/sh", "-c"]
            args:
              - |
                set -e
                pip install -q --user matplotlib
                python3 -c "import urllib.request; urllib.request.urlretrieve('https://raw.githubusercontent.com/RationAI/cronjobs/main/grafana/cluster_stats/cluster_stats.py', 'cluster_stats.py')"
                python3 cluster_stats.py
            envFrom:
            - secretRef:
                name: cluster-stats-secrets
            env:
            - name: HTTPS_PROXY      # namespace has no direct egress; same MUNI proxy
              value: http://proxy.ics.muni.cz:3128  # the normal jobs use
            - name: NO_PROXY        # Grafana is reachable directly, keep it off the proxy
              value: grafana.rationai.cloud.trusted.e-infra.cz,svc.cluster.local
            - name: HOME           # writable HOME so pip --user and matplotlib work
              value: /tmp
            - name: MPLCONFIGDIR     # matplotlib needs a writable config dir
              value: /tmp
            # Uncomment if the pods can't reach the external Grafana URL and
            # you need the in-cluster one instead:
            #- name: GRAFANA_URL
            #  value: https://grafana.rationai.cloud.trusted.e-infra.cz
